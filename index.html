<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarks Mini</title>
    <link rel="stylesheet" href="style.css" />
    <script src="/app.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>Bookmarks Mini</h1>
    </header>

    <main class="main">
        <ul class="bookmarks"></ul>
        <p class="no-bookmarks-error">Inga bokmärken har skapats än</p>
        <button class="button button--new-bookmark" onclick="showNewBookmarkDialog()">Nytt bokmärke</button>
    </main>

    <dialog class="bookmark-dialog">
            <h2>
                <span class="bookmark-dialog__new-header">Nytt bokmärke</span>
                <span class="bookmark-dialog__update-header">Uppdatera bokmärke</span>
            </h2>

            <section class="bookmark-dialog__input-section">
                <label class="bookmark-dialog__label" for="title">Titel:</label>
                <input class="bookmark-dialog__input" id="title" type="text" oninput="removeErrorHighlight(this)">
                <p class="bookmark-dialog__error" id="title-error"></p>
                
                <label class="bookmark-dialog__label" for="url">URL:</label>
                <input class="bookmark-dialog__input" id="url" type="url" oninput="removeErrorHighlight(this)">
                <p class="bookmark-dialog__error" id="url-error"></p>
            </section>

            <section class="bookmark-dialog__button-section">
                <button class="button button--dialog-new" onclick="addBookmark()">Lägg till</button>
                <button class="button button--dialog-update" onclick="updateBookmark()">Uppdatera</button>

                <button class="button button--dialog-cancel" onclick="hideBookmarkDialog()">Avbryt</button>
            </section>
    </dialog>
</body>
</html>
